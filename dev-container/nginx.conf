# Vanalume production nginx — HTTPS on 443, HTTP redirect, /api proxy.
#
# TLS is terminated here. The Let's Encrypt certificate lives under
# /etc/letsencrypt/live/vanalume.com/ (mounted from the certbot volume); a
# self-signed placeholder is generated by the entrypoint on first boot so nginx
# can start before the real cert is issued.

server {
    listen 443 ssl;
    server_name vanalume.com;

    ssl_certificate     /etc/letsencrypt/live/vanalume.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vanalume.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        # Resolve the backend lazily via Docker's embedded DNS so nginx can start
        # before the backend container is up (backend depends_on a healthy frontend).
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name vanalume.com;

    # ACME HTTP-01 challenge webroot for Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
